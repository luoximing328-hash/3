<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逻辑罗盘 - 法影随行</title>
    <link rel="stylesheet" href="styles/main.css?v=3">
    <link rel="stylesheet" href="styles/components.css?v=3">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h1>法影随行</h1>
                    <span class="slogan">看得懂的法律故事，用得上的维权武器</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="theater.html" class="nav-link">法影剧场</a></li>
                <li><a href="simulator.html" class="nav-link">法庭直通车</a></li>
                <li><a href="compass.html" class="nav-link active">逻辑罗盘</a></li>
                <li><a href="toolbox.html" class="nav-link">智慧助诉中心</a></li>
                <li><a href="volunteer.html" class="nav-link">志愿者</a></li>
                <li class="user-info">
                    <span class="points">法力值: <span id="userPoints">0</span></span>
                    <a href="#profile" class="btn-secondary" id="profileLink">个人中心</a>
                </li>
            </ul>
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 逻辑罗盘 -->
    <section class="section compass-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">逻辑罗盘</h2>
                <p class="section-subtitle">五维拆解，让裁判文书一目了然</p>
            </div>
            <div class="compass-search">
                <input type="text" id="documentSearch" placeholder="输入案号或关键词搜索裁判文书..." class="search-input">
                <button class="btn-primary" id="searchBtn">搜索</button>
            </div>
            <div class="compass-content-wrapper">
                <div class="compass-demo" id="compassDemo">
                    <div class="demo-placeholder">
                        <p>🔍 搜索或选择一个示例案例开始分析</p>
                    </div>
                </div>
                <div class="legal-glossary-sidebar" id="legalGlossarySidebar">
                    <div class="glossary-header">
                        <h3>📚 法条通俗百科</h3>
                        <p class="glossary-subtitle">专业名词解释</p>
                    </div>
                    <div class="glossary-current-case" id="glossaryCurrentCase">
                        <h4>本案中的专业名词</h4>
                        <div class="glossary-terms-list" id="glossaryTermsList">
                            <p class="glossary-empty">选择案例后，相关专业名词将显示在这里</p>
                        </div>
                    </div>
                    <div class="glossary-search">
                        <input type="text" id="glossarySearch" placeholder="搜索专业名词..." class="glossary-search-input">
                    </div>
                    <div class="glossary-all-terms" id="glossaryAllTerms">
                        <h4>全部词条</h4>
                        <div class="glossary-terms-list" id="glossaryAllTermsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 个人中心模态框 -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>个人中心</h2>
            <div class="profile-info">
                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="totalPoints">0</span>
                        <span class="stat-label">总法力值</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="comicsRead">0</span>
                        <span class="stat-label">已读漫画</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="simulationsDone">0</span>
                        <span class="stat-label">完成模拟</span>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn-primary" id="checkInBtn">每日签到</button>
                    <a href="volunteer.html" class="btn-secondary">志愿者申请</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="scripts/nav.js"></script>
    <script src="scripts/user.js"></script>
    <script src="scripts/compass.js"></script>
</body>
</html>
